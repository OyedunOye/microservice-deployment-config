apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.ns}}
spec:
  securityContext:
    runAsNonRoot: true
  replicas: {{ .Values.appReplicas }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
        - name: {{ .Values.appName }}
          image: "{{ .Values.appImage }}:{{ .Values.appVersion}}"
          securityContext:
            runAsNonRoot: true
          ports:
            - containerPort: {{ .Values.containerPort }}
          livenessProbe:
            initialDelaySeconds: 5
            {{- if .Values.httpHealthPath }}
            httpGet:
              path: {{ .Values.httpHealthPath }}
              port: {{ .Values.containerPort}}
              {{- with .Values.httpHealthHeaders }}
              httpHeaders:
              {{- range . }}
              - name: {{ .name }}
                value: {{ .value | quote }}
              {{- end }}
              {{- end }}
            {{- else }}
            grpc:
              port: {{ .Values.containerPort}}
            {{- end }}
            periodSeconds: 5
          readinessProbe:
            initialDelaySeconds: 5
            {{- if .Values.httpHealthPath }}
            httpGet:
              path: {{ .Values.httpHealthPath }}
              port: {{ .Values.containerPort}}
              {{- with .Values.httpHealthHeaders }}
              httpHeaders:
              {{- range . }}
              - name: {{ .name }}
                value: {{ .value | quote }}
              {{- end }}
              {{- end }}
            {{- else }}
            grpc:
              port: {{ .Values.containerPort}}
            {{- end }}
            periodSeconds: 5
          resources:
            requests: 
              cpu: {{ .Values.cpuRequest }}
              memory: {{ .Values.memoryRequest }}
            limits:
              cpu: {{ .Values.cpuLimit }}
              memory: {{ .Values.memeoryLimit}}
          env:
          {{- range .Values.containerEnvVars}}
          - name: {{ .name }}
            value: {{ .value | quote }}
          {{- end}}